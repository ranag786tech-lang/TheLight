<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Light - النور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash-screen">
        <div class="loader-content">
            <h1 class="loader-logo">النور</h1>
            <p style="color: #f1d279; margin-top: 15px; letter-spacing: 2px;">نور کی تلاش جاری ہے...</p>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>النور</h1>
            <p class="tagline">وہی پاؤ گے جس کی تم کوشش کرو گے</p>
        </header>

        <div class="card">
            <h2 id="divine-name">الرَّحْمٰنُ</h2>
            <p id="meaning">لوڈنگ...</p>
            <div class="verse-box">
                <p id="quran-verse"></p>
            </div>
            <p id="economic-rule" class="rule-box"></p>
        </div>

        <div class="navigation-area">
            <button id="prev-btn" onclick="prevName()">&#10094;</button> 
            <button id="next-btn" onclick="nextName()">&#10095;</button>
        </div>

        <div class="action-area">
            <button id="counter-btn" onclick="count(event)">0</button>
            <p style="margin-top: 15px; opacity: 0.8;">ذکرِ قلب جاری رکھیں</p>
        </div>
    </div>

    <div id="magnetic-glow"></div>

    <script src="script.js"></script>
</body>
</html>
